server:
  forward-headers-strategy: framework

spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true # 요청과 응답 모두 UTF-8을 강제 적용

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: ZZAZO

  datasource:
    url: jdbc:h2:mem:zzazo
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${SES_MAIL_USERNAME:}
    password: ${SES_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/seed/local

app:
  email-verification:
    expiration-minutes: 5
    code-length: 6
    subject: "[ZZAZO] 이메일 인증번호"
    from: "leets@zzazo.xyz"

jwt:
  secret: ${JWT_SECRET:zzazo-local-dev-jwt-secret-key-please-change-in-production-0123456789}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

# 로그 포맷 지정
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n"


recommend:
  timeout: 5000000000